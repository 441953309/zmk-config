# CONFIG_ZMK_IDLE_TIMEOUT=30000
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000
# CONFIG_ZMK_PM_SOFT_OFF=y

CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30

# 提高蓝牙发射功率，改善弱信号/远距离连接稳定性（更耗电）
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#Disabling PHY 2Mbps
CONFIG_BT_CTLR_PHY_2M=n
#Enabling passkey entry
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# 启用 ZMK Studio 运行时改键（需 build.yaml 中 studio-rpc-usb-uart snippet）
CONFIG_ZMK_STUDIO=y
# 关闭 Studio 锁定后可免解锁直接改键；默认开启锁定，需 L4 右上角 &studio_unlock
# CONFIG_ZMK_STUDIO_LOCKING=n

# ZMK USB日志配置
# CONFIG_ZMK_USB_LOGGING=y

#CONFIG_BT_MAX_PAIRED=1

CONFIG_USB_DEVICE_VID=0x303A
CONFIG_USB_DEVICE_PID=0x4001
CONFIG_USB_DEVICE_MANUFACTURER="qoo"
